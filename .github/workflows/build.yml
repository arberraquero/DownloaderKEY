
name: Compilar LogDownloader AIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar extension
        id: build
        uses: pavi2410/AIX-Action@main
        with:
          source-dir: src
          package-name: com.freddy.logdownloader

      - name: Guardar archivo AIX
        uses: actions/upload-artifact@v4
        with:
          name: LogDownloader-AIX
          path: ${{ steps.build.outputs.extension-path }}
          if-no-files-found: error
